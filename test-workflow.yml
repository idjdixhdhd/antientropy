name: 每日资讯自动更新
on:
  schedule:
    - cron: '0 0 * * *'        # 每天 UTC 00:00 = 北京时间 08:00
  workflow_dispatch:           # 也支持手动触发
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓取并合并资讯
        run: node fetch-news.cjs
      - name: 提交变更（有变化才提交）
        run: |
          git config user.name "antientropy-bot"
          git config user.email "antientropy-bot@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "资讯无变化，跳过提交"
          else
            git commit -m "每日资讯自动更新 $(date +%m-%d)"
            git push
            echo "已推送资讯更新"
          fi
